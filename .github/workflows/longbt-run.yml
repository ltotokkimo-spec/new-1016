name: LongBT Run

# 長期回測第三段：用 longbt-fetch 存好的快取跑各組合的歷史回測（成本全扣）。規則與判定標準見 stock-app/longbt/PREREG.md。
# 只在 stock-app/tools/probe/longbt-run.env 被推送時執行（放在 tools/probe 底下，才不會觸發 App 打包）。
# 預設只跑階段 A（B、C 封存：連資料都不載入）；env 檔裡設 LBT_OPEN_B=1 才會開封，要先經使用者同意。
on:
  push:
    branches: [ 'claude/ui-calculator-interface-t3x9kh' ]
    paths: [ 'stock-app/tools/probe/longbt-run.env' ]

permissions:
  contents: read

concurrency:
  group: longbt-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: stock-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stock-app/package-lock.json
      - run: npm ci
      - run: npx vitest run test/longbt.test.ts
      - name: 還原長期回測快取（只讀）
        uses: actions/cache/restore@v4
        with:
          path: stock-app/.lbt-cache
          key: longbt-cache-run-${{ github.run_id }}
          restore-keys: longbt-cache-
      - name: 回測
        run: |
          set -a; . tools/probe/longbt-run.env; set +a
          npx vite build --ssr tools/longbt-run.ts --outDir .lbt-build
          NODE_OPTIONS=--max-old-space-size=6144 node .lbt-build/longbt-run.js .lbt-cache 2>&1 | tee lbt-run.log
