name: Build Windows EXE

on:
  push:
    branches: [ main, 'claude/**' ]
    paths-ignore: [ 'stock-app/**', '.github/workflows/stock-app.yml' ]
  pull_request:
    paths-ignore: [ 'stock-app/**', '.github/workflows/stock-app.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install pyinstaller pillow

      - name: 測試程式邏輯
        run: python -m unittest discover -s tests -v

      - name: 打包計算機
        run: pyinstaller --onefile --windowed --name 計算機 calculator.py

      - name: 打包小畫家
        run: pyinstaller --onefile --windowed --name 小畫家 paint.py

      - name: 實際啟動計算機測試
        shell: pwsh
        run: ./tests/smoke_test_exe.ps1 -ExePath "dist/計算機.exe" -Title "計算機" -OutDir smoke

      - name: 實際啟動小畫家測試
        shell: pwsh
        run: ./tests/smoke_test_paint.ps1 -ExePath "dist/小畫家.exe" -OutDir smoke-paint

      - name: 上傳計算機
        uses: actions/upload-artifact@v4
        with:
          name: 計算機-windows-exe
          path: dist/計算機.exe

      - name: 上傳小畫家
        uses: actions/upload-artifact@v4
        with:
          name: 小畫家-windows-exe
          path: dist/小畫家.exe

      - name: 上傳測試截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 測試截圖
          path: |
            smoke/
            smoke-paint/
          if-no-files-found: ignore
