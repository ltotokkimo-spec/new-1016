name: Stock App

on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'stock-app/**', '!stock-app/tools/probe/**', '!stock-app/virtual/**', '.github/workflows/stock-app.yml' ]
  workflow_dispatch:

permissions:
  contents: write

# 新的推送會取消同分支還在跑的舊測試
concurrency:
  group: stock-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: stock-app
    steps:
      - uses: actions/checkout@v4

      # 先確認測試主機連得到證交所：連不到時 App 第一次開啟會卡在下載，跑完整個打包＋模擬器（約 12 分鐘）才失敗。
      # 這裡最多等 4 分鐘（證交所常是暫時擋），還是連不到就直接停，省下打包與模擬器的時間。
      - name: 檢查證交所連線
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            body=$(curl -s -m 20 -A "Mozilla/5.0" "https://www.twse.com.tw/rwd/zh/fund/T86?date=20261016&selectType=ALLBUT0999&response=json" | head -c 200)
            case "$body" in *'"stat"'*) echo "證交所可連線（第 $i 次）"; exit 0;; esac
            echo "第 $i 次連不到證交所，30 秒後重試"; sleep 30
          done
          echo "::error::測試主機連不到證交所（www.twse.com.tw），台股資料無法下載，先停止測試；稍後重跑即可"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stock-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安裝套件
        run: npm ci

      - name: 單元測試
        run: npx vitest run

      - name: 建置網頁
        run: npm run build

      - name: 同步到 Android 專案
        run: npx cap sync android

      # Gradle 本體（約 200MB）官方放在 GitHub Releases，11/08 連續好幾次逾時或 504。
      # 1) 快取：下載成功過就直接用，不再每次下載
      - name: 還原 Gradle 快取
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dist-${{ hashFiles('stock-app/android/gradle/wrapper/gradle-wrapper.properties') }}

      # 2) 官方下載失敗就改用鏡像站，並用官方公布的 SHA-256 檢查碼比對，相符才使用（抓不到檢查碼就不用鏡像）
      - name: 下載 Gradle（失敗重試、改用鏡像）
        working-directory: stock-app/android
        run: |
          for i in 1 2; do
            ./gradlew --version --no-daemon -q && exit 0
            echo "官方下載 Gradle 失敗（第 $i 次），30 秒後重試"; sleep 30
          done
          url=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's#\\:#:#g')
          name=$(basename "$url"); ver=$(echo "$name" | sed -E 's/gradle-(.*)-(all|bin)\.zip/\1/')
          sha=$(curl -fsSL -m 30 --retry 5 --retry-delay 5 "$url.sha256" || true)
          if ! echo "$sha" | grep -qE '^[0-9a-f]{64}$'; then echo "::error::取不到官方檢查碼，不使用鏡像（稍後重跑即可）"; exit 1; fi
          for m in "https://mirrors.cloud.tencent.com/gradle/$name" "https://mirrors.aliyun.com/gradle/distributions/v$ver/$name"; do
            echo "改從鏡像下載：$m"
            curl -fL -m 900 --retry 2 -o "$RUNNER_TEMP/$name" "$m" || continue
            echo "$sha  $RUNNER_TEMP/$name" | sha256sum -c - || { echo "檢查碼不符，不使用"; continue; }
            sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$RUNNER_TEMP/$name#" gradle/wrapper/gradle-wrapper.properties
            ./gradlew --version --no-daemon -q && exit 0
          done
          echo "::error::Gradle 官方與鏡像都下載失敗"; exit 1

      - name: 打包 APK
        working-directory: stock-app/android
        # debug 給模擬器實測（測試工具要連進 WebView 檢查畫面，只有 debug 允許）；release 發布給手機（不可除錯，同一把簽章）
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: 檢查 release APK（不可除錯、簽章和 debug 相同）
        working-directory: stock-app/android/app/build/outputs/apk
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          REL=release/app-release.apk DBG=debug/app-debug.apk
          test -f "$REL"
          # 先確認檢查方法有效：debug 一定是可除錯
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$DBG" | grep -q 'debuggable.*=true'
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$REL" | grep -q 'debuggable.*=true'; then echo "release 竟然是可除錯版本"; exit 1; fi
          C1=$("$BT/apksigner" verify --print-certs "$REL" | grep 'SHA-256 digest')
          C2=$("$BT/apksigner" verify --print-certs "$DBG" | grep 'SHA-256 digest')
          echo "release: $C1"; echo "debug:   $C2"
          test -n "$C1" && test "$C1" = "$C2"
          "$BT/aapt2" dump badging "$REL" | grep -E "^package:|application-label:"

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-radar-apk
          path: |
            stock-app/android/app/build/outputs/apk/debug/app-debug.apk
            stock-app/android/app/build/outputs/apk/release/app-release.apk

      - name: 啟用 KVM（模擬器加速）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 模擬器映像檔偶爾下載到壞檔（ZipFile unknown archive），先下載並重試，之後的步驟就直接用
      - name: 預先下載模擬器映像（失敗重試）
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          for i in 1 2 3; do
            "$SDKM" --install 'system-images;android-34;google_apis;x86_64' 'emulator' 'platform-tools' > /dev/null && break
            echo "第 $i 次下載失敗，10 秒後重試"; sleep 10
          done
          test -d "$ANDROID_HOME/system-images/android-34/google_apis/x86_64"

      - name: Android 模擬器實測（真實網路資料）
        timeout-minutes: 27
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Claude AI 實測會花 API 額度（約 US$1.5/次），只有手動執行時才測；平常推送不花錢
          ANTHROPIC_API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.ANTHROPIC_API_KEY || '' }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -timezone Asia/Taipei
          working-directory: stock-app
          script: node tools/e2e-android.cjs android/app/build/outputs/apk/debug/app-debug.apk

      - name: 發布 APK（手機直接下載）
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk stock-radar.apk
          # App 內更新會讀這個檔案比對版本號
          node -e 'const fs=require("fs");fs.writeFileSync("version.json",JSON.stringify({versionCode:Number(process.env.GITHUB_RUN_NUMBER),versionName:"1.0."+process.env.GITHUB_RUN_NUMBER,minVersionCode:Number((fs.existsSync("MIN_VERSION")?fs.readFileSync("MIN_VERSION","utf8"):"0").trim())||0,notes:fs.readFileSync("RELEASE_NOTES.txt","utf8").trim()}))'
          cat version.json
          # 舊載點 stock-radar-latest 停用（11/11 使用者要求，不再提供下載）；每次都確認已刪除
          gh release delete stock-radar-latest --yes --cleanup-tag || true
          gh release delete radar-app-d43m21s655 --yes --cleanup-tag || true
          gh release create radar-app-d43m21s655 stock-radar.apk version.json \
            --title "金雷達（最新版）" --prerelease --target "${{ github.sha }}" \
            --notes "用 Android 手機開這個頁面，點 stock-radar.apk 下載安裝。版本 1.0.${{ github.run_number }}，已在 Android 模擬器上以真實資料測試通過。"
