name: Stock Backtest Daily

# 股市雷達 App 的回測每天自動更新。
# GitHub 只會在預設分支執行定時工作，所以這裡只負責「每天叫一次」，
# 實際的回測程式在 App 的開發分支（stock-backtest.yml）。
on:
  schedule:
    - cron: '40 8 * * 1-5' # 週一到週五 台灣時間 16:40（三大法人約 15:00～16:00 公布；萬一當天還沒公布，隔天重算會自動補正）
  workflow_dispatch:

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 觸發回測
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stock-backtest.yml --repo "${{ github.repository }}" --ref claude/ui-calculator-interface-t3x9kh
