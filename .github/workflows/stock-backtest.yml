name: Stock Backtest

# 用 App 的評分規則回測過去約 2 年，結果發布到 Releases 的 radar-data-vug13iw701，App 會自動下載。
on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'stock-app/src/engine/**', 'stock-app/src/data/**', 'stock-app/tools/backtest.ts', '.github/workflows/stock-backtest.yml' ]
  workflow_dispatch: # 每天由預設分支的 stock-backtest-daily.yml 觸發（台灣時間 18:40）

permissions:
  contents: write

concurrency:
  group: stock-backtest
  cancel-in-progress: false

jobs:
  # 主動式 ETF 持股比對（和回測無關，平行跑，幾分鐘就好）
  active-etf:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/stock-active-etf.yml

  # 台股指數歷史累積（App 數據頁點指數看日 K 用，平行跑）
  index-hist:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/stock-index-hist.yml

  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: stock-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stock-app/package-lock.json

      - run: npm ci

      - name: 單元測試
        run: npx vitest run test/pickLog.test.ts test/backtest.test.ts test/factors.test.ts test/scorecompare.test.ts test/steady.test.ts test/watch.test.ts test/revHist.test.ts test/tw.test.ts test/score.test.ts

      # 過去的交易日資料不會變，存在快取裡，之後每次只補新的日子
      - name: 還原資料快取
        uses: actions/cache/restore@v4
        with:
          path: stock-app/.bt-cache
          key: bt-cache-${{ github.run_id }}
          restore-keys: bt-cache-

      # 推薦績效追蹤（使用者 11/7 要求）：紀錄存在 stock-radar-log 分支的 picks.json（台股）、picks-etf.json、picks-us.json，只新增、不覆蓋（git 歷史保留每一天的版本）
      - name: 準備推薦紀錄（stock-radar-log 分支）
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          # 先確認分支在不在：ls-remote 回 2＝確定不存在（第一次才建新的），0＝存在，其他＝連線失敗
          # 分支存在卻下載失敗時，今天不記錄（不能當成空紀錄重新開始，App 會只看到今天的名單）
          set +e
          rc=1
          for i in 1 2 3 4; do
            git ls-remote --exit-code --heads origin stock-radar-log >/dev/null 2>&1; rc=$?
            if [ $rc -eq 0 ] || [ $rc -eq 2 ]; then break; fi
            echo "查詢 stock-radar-log 失敗（第 $i 次），稍後重試"; sleep $((i*5))
          done
          if [ $rc -eq 2 ]; then
            echo "還沒有 stock-radar-log 分支，建立新的"
            git worktree add --orphan -b stock-radar-log "$RUNNER_TEMP/radar-log" || { echo "::warning::建立推薦紀錄分支失敗，今天不記錄"; exit 0; }
          elif [ $rc -eq 0 ]; then
            ok=0
            for i in 1 2 3 4; do git fetch --depth 1 origin stock-radar-log && { ok=1; break; }; echo "下載推薦紀錄失敗（第 $i 次），稍後重試"; sleep $((i*5)); done
            if [ $ok -ne 1 ]; then echo "::warning::下載推薦紀錄失敗，今天不記錄（舊紀錄與 App 上的資料不受影響）"; exit 0; fi
            git worktree add -B stock-radar-log "$RUNNER_TEMP/radar-log" FETCH_HEAD || { echo "::warning::準備推薦紀錄失敗，今天不記錄"; exit 0; }
            [ -f "$RUNNER_TEMP/radar-log/picks.json" ] || { echo "::warning::推薦紀錄分支裡沒有 picks.json，今天不記錄"; exit 0; }
          else
            echo "::warning::連不到 GitHub 查推薦紀錄，今天不記錄"; exit 0
          fi
          ls -la "$RUNNER_TEMP/radar-log"
          echo "PICKLOG=$RUNNER_TEMP/radar-log/picks.json" >> "$GITHUB_ENV"

      - name: 下載證交所／櫃買資料並回測
        run: |
          npx vite build --ssr tools/backtest.ts --outDir .bt-build
          node .bt-build/backtest.js .bt-cache backtest.json

      - name: 儲存推薦紀錄（只新增）
        if: github.event_name != 'pull_request' && env.PICKLOG != ''
        working-directory: .
        run: |
          cd "$RUNNER_TEMP/radar-log"
          ls picks*.json >/dev/null 2>&1 || { echo "沒有產生推薦紀錄"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks*.json  # 含 picks-final*.json（定案結果）
          if git diff --cached --quiet; then echo "今天沒有新增推薦紀錄"; exit 0; fi
          msg=$(node -e 'const fs=require("fs");const o=[];for(const [f,n] of [["picks.json","台股"],["picks-etf.json","ETF"],["picks-us.json","美股"]]){if(!fs.existsSync(f))continue;const p=JSON.parse(fs.readFileSync(f,"utf8")).picks;o.push(n+" "+(p.length?p[p.length-1].date:"—")+"（累計 "+p.length+" 筆）")}console.log(o.join("、"))')
          git commit -q -m "推薦紀錄：$msg"
          for i in 1 2 3 4; do git push origin HEAD:stock-radar-log && exit 0; echo "推送失敗（第 $i 次），稍後重試"; sleep $((i*5)); done
          exit 1

      - name: 儲存資料快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stock-app/.bt-cache
          key: bt-cache-${{ github.run_id }}

      - name: 檢查結果
        run: |
          node -e '
            const r = require("./backtest.json");
            const s = r.stocks;
            if (s.signals < 15) throw new Error("評等日太少：" + s.signals);
            for (const g of ["買入","觀望","離場","全部"]) if (!(s.groups[g]?.[5]?.n > 0)) throw new Error(g + " 沒有樣本");
            console.log("OK", r.from, "~", r.to, "評等日", s.signals, "買入樣本", s.groups["買入"][20]?.n);
          '

      # 研究用（11/14 使用者要求設計自組 ETF 新規則）：把回測用的原始資料快取＋歷史月營收打包放到 Release，
      # 讓 Claude 的雲端環境（連不到證交所）可以下載後在本機反覆模擬。只在推送時做，每天的定時回測不做。
      - name: 匯出研究資料（只在推送時）
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .research/rev
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          ok=0; bad=0
          for ym in $(node -e 'const o=[];let y=2024,m=1;const n=new Date();while(y<n.getUTCFullYear()||(y===n.getUTCFullYear()&&m<=n.getUTCMonth()+1)){o.push((y-1911)+"_"+m);m++;if(m>12){m=1;y++}}console.log(o.join(" "))'); do
            for mk in sii otc; do
              f=".research/rev/${mk}_${ym}.html"
              got=0
              for host in mopsov.twse.com.tw mops.twse.com.tw; do
                if curl -sS -m 40 -A "$UA" -o "$f" "https://$host/nas/t21/$mk/t21sc03_${ym}_0.html" && [ "$(wc -c < "$f")" -gt 20000 ]; then got=1; break; fi
                sleep 2
              done
              if [ $got = 1 ]; then ok=$((ok+1)); else bad=$((bad+1)); rm -f "$f"; fi
              sleep 2
            done
          done
          echo "月營收檔：成功 $ok、失敗 $bad"
          cp backtest.json steady.json .research/ 2>/dev/null || true
          du -sh .bt-cache .research
          tar czf research-data.tgz .bt-cache .research
          ls -la research-data.tgz
          for i in 1 2 3 4; do gh release upload radar-data-vug13iw701 research-data.tgz --clobber && break; sleep $((i*5)); done

      - name: 發布結果（App 下載）
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view radar-data-vug13iw701 >/dev/null 2>&1 || \
            gh release create radar-data-vug13iw701 --title "股市雷達回測資料" --prerelease --notes "App 自動下載的回測結果，不需要手動下載。" --target "${{ github.sha }}"
          # GitHub 的上傳 API 偶爾回 HTTP 500（11/04 連續發生），每個檔案最多試 4 次，間隔 5、10、15 秒
          up() { for i in 1 2 3 4; do gh release upload radar-data-vug13iw701 "$1" --clobber && return 0; echo "上傳 $1 失敗（第 $i 次），稍後重試"; sleep $((i*5)); done; return 1; }
          up backtest.json
          for f in factors.json scorecompare.json steady.json n5.json wide.json regime.json lead.json ai.json real.json turn.json dual.json exdiv.json picks-perf.json picks.csv picks-perf-etf.json picks-etf.csv picks-perf-us.json picks-us.csv; do
            if [ -f "$f" ]; then up "$f"; fi
          done
          # 11/11 使用者要求停用舊版 App 的雲端資料：舊位置 stock-radar-data 還在的話，把新位置沒有的檔案（主動式 ETF、指數歷史累積檔等）搬過來，再刪掉舊位置
          if gh release view stock-radar-data >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/old-data" && gh release download stock-radar-data --dir "$RUNNER_TEMP/old-data" --clobber || true
            have=$(gh release view radar-data-vug13iw701 --json assets -q '.assets[].name')
            for f in "$RUNNER_TEMP"/old-data/*; do [ -f "$f" ] || continue; n=$(basename "$f"); echo "$have" | grep -qxF "$n" || up "$f"; done
            gh release delete stock-radar-data --yes --cleanup-tag && echo "舊資料位置 stock-radar-data 已刪除"
          fi
