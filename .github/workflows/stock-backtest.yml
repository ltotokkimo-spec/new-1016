name: Stock Backtest

# 用 App 的評分規則回測過去約 2 年，結果發布到 Releases 的 stock-radar-data，App 會自動下載。
on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'stock-app/src/engine/**', 'stock-app/src/data/**', 'stock-app/tools/backtest.ts', '.github/workflows/stock-backtest.yml' ]
  workflow_dispatch: # 每天由預設分支的 stock-backtest-daily.yml 觸發（台灣時間 18:40）

permissions:
  contents: write

concurrency:
  group: stock-backtest
  cancel-in-progress: false

jobs:
  # 主動式 ETF 持股比對（和回測無關，平行跑，幾分鐘就好）
  active-etf:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/stock-active-etf.yml

  # 台股指數歷史累積（App 數據頁點指數看日 K 用，平行跑）
  index-hist:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/stock-index-hist.yml

  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: stock-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stock-app/package-lock.json

      - run: npm ci

      - name: 單元測試
        run: npx vitest run test/pickLog.test.ts test/backtest.test.ts test/factors.test.ts test/scorecompare.test.ts test/steady.test.ts test/watch.test.ts test/tw.test.ts test/score.test.ts

      # 過去的交易日資料不會變，存在快取裡，之後每次只補新的日子
      - name: 還原資料快取
        uses: actions/cache/restore@v4
        with:
          path: stock-app/.bt-cache
          key: bt-cache-${{ github.run_id }}
          restore-keys: bt-cache-

      # 推薦績效追蹤（使用者 11/7 要求）：紀錄存在 stock-radar-log 分支的 picks.json，只新增、不覆蓋（git 歷史保留每一天的版本）
      - name: 準備推薦紀錄（stock-radar-log 分支）
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          if git fetch --depth 1 origin stock-radar-log; then
            git worktree add -B stock-radar-log "$RUNNER_TEMP/radar-log" FETCH_HEAD
          else
            echo "還沒有 stock-radar-log 分支，建立新的"
            git worktree add --orphan -b stock-radar-log "$RUNNER_TEMP/radar-log"
          fi
          ls -la "$RUNNER_TEMP/radar-log"
          echo "PICKLOG=$RUNNER_TEMP/radar-log/picks.json" >> "$GITHUB_ENV"

      - name: 下載證交所／櫃買資料並回測
        run: |
          npx vite build --ssr tools/backtest.ts --outDir .bt-build
          node .bt-build/backtest.js .bt-cache backtest.json

      - name: 儲存推薦紀錄（只新增）
        if: github.event_name != 'pull_request' && env.PICKLOG != ''
        working-directory: .
        run: |
          cd "$RUNNER_TEMP/radar-log"
          [ -f picks.json ] || { echo "沒有產生 picks.json"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add picks.json
          if git diff --cached --quiet; then echo "今天沒有新增推薦紀錄"; exit 0; fi
          git commit -q -m "推薦紀錄：$(node -e 'const l=require("./picks.json");const p=l.picks;console.log(p.length?p[p.length-1].date:"")') 收盤（累計 $(node -e 'console.log(require("./picks.json").picks.length)') 筆）"
          for i in 1 2 3 4; do git push origin HEAD:stock-radar-log && exit 0; echo "推送失敗（第 $i 次），稍後重試"; sleep $((i*5)); done
          exit 1

      - name: 儲存資料快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: stock-app/.bt-cache
          key: bt-cache-${{ github.run_id }}

      - name: 檢查結果
        run: |
          node -e '
            const r = require("./backtest.json");
            const s = r.stocks;
            if (s.signals < 15) throw new Error("評等日太少：" + s.signals);
            for (const g of ["買入","觀望","離場","全部"]) if (!(s.groups[g]?.[5]?.n > 0)) throw new Error(g + " 沒有樣本");
            console.log("OK", r.from, "~", r.to, "評等日", s.signals, "買入樣本", s.groups["買入"][20]?.n);
          '

      - name: 發布結果（App 下載）
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view stock-radar-data >/dev/null 2>&1 || \
            gh release create stock-radar-data --title "股市雷達回測資料" --prerelease --notes "App 自動下載的回測結果，不需要手動下載。" --target "${{ github.sha }}"
          # GitHub 的上傳 API 偶爾回 HTTP 500（11/04 連續發生），每個檔案最多試 4 次，間隔 5、10、15 秒
          up() { for i in 1 2 3 4; do gh release upload stock-radar-data "$1" --clobber && return 0; echo "上傳 $1 失敗（第 $i 次），稍後重試"; sleep $((i*5)); done; return 1; }
          up backtest.json
          for f in factors.json scorecompare.json steady.json n5.json wide.json regime.json lead.json ai.json real.json turn.json picks-perf.json picks.csv; do
            if [ -f "$f" ]; then up "$f"; fi
          done
